services:
  games:
    build: .
    # Docker's DNS name for this service. Your reverse proxy addresses it by this name, so if you
    # change it, change the proxy entry to match.
    container_name: games_server
    environment:
      # Must be long and stable. Reconnect tokens are HMACs over it, so a random per-boot secret
      # means every restart drops players out of matches in progress.
      SESSION_SECRET: "${SESSION_SECRET:?set SESSION_SECRET to a long random string}"
      PORT: "${GAMES_PORT:-8787}"
      DATA_DIR: /data
    volumes:
      - ./data:/data
    restart: unless-stopped
    # Turn-based traffic is tiny; this is generous.
    mem_limit: 512m
    # Published on loopback only, for standalone use and for poking at /healthz from the host.
    # If a reverse proxy reaches this over a Docker network, use docker-compose.caddy.yml instead,
    # which drops the published port entirely.
    networks:
      - caddy

networks:
  caddy:
    name: caddy_net
    external: true

