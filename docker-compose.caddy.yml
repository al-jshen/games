# Override for running behind a Caddy container on a shared Docker network.
#
#   docker compose -f docker-compose.yml -f docker-compose.caddy.yml up -d --build
#
# It does two things: joins the proxy's network so Caddy can reach the container by name, and stops
# publishing a host port, since nothing outside that network needs to reach it.
#
# Set PROXY_NETWORK to whatever your Caddy stack's network is actually called. `docker network ls`
# will tell you; compose-created names are usually prefixed with the project directory, e.g.
# `caddy_default`.

services:
  games:
    networks:
      - proxy
    # Reachable on the proxy network as games_server:8787, but not from the host.
    ports: !reset []
    expose:
      - "${GAMES_PORT:-8787}"

networks:
  proxy:
    external: true
    name: "${PROXY_NETWORK:-caddy_default}"
