[project]
name = "games"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jeff Shen", email = "jshen@flatironinstitute.org" }
]
requires-python = ">=3.12"
# The self-play tooling under tools/selfplay: the trainers (torch, numpy), the dataset reader
# (numpy) and the orchestrator (pyyaml). Nothing else in the repo is Python.
#
# torch is deliberately *not* here -- it is picked by group below.
dependencies = [
    "numpy>=2.1",
    "pyyaml>=6.0",
]

# Which torch build to fetch. The wheels differ by an order of magnitude -- ~180MB for CPU against
# ~2.5GB for CUDA -- so the build is chosen by group rather than baked into the dependency list.
#
# **CUDA is the default, and it has to be**, because one virtual environment is shared by machines
# that disagree about whether there is a GPU. The self-play loop submits its training step to a GPU
# node but embeds `sys.executable` -- the interpreter of whichever workstation launched the
# orchestrator -- so the compute node runs *this* `.venv`, off GPFS. A CPU-only build there reports
# `torch.cuda.is_available() == False` on an H100 and the trainer quietly picks CPU: it does not
# fail, it just takes about fifty times as long and then hits its walltime.
#
# That happened. This was `default-groups = ["cpu"]`, chosen because the workstation has no GPU, and
# a generation's value head trained for 55 minutes on CPU while an H100 sat idle beside it.
#
# The trap is that `uv run` re-syncs the default groups before *every* command, so a default of
# `cpu` does not merely start wrong -- it actively reverts any `uv sync --group cu128` the next time
# the loop is launched. The default must be the build the GPU node needs. A CUDA wheel on a machine
# with no GPU is merely large; a CPU wheel on a machine with one is a silent fifty-fold slowdown.
#
#     uv run ...                                 # CUDA, the default
#     uv sync --no-default-groups --group cpu    # only if the 2.5GB is genuinely a problem
#
# The two are declared as conflicting, so uv locks a separate resolution for each rather than
# trying to satisfy both at once.
[dependency-groups]
cpu = ["torch>=2.5"]
cu128 = ["torch>=2.5"]

[tool.uv]
default-groups = ["cu128"]
conflicts = [[{ group = "cpu" }, { group = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", group = "cpu" },
    { index = "pytorch-cu128", group = "cu128" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
