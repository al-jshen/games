# The self-play loop, end to end.
#
#     python3 tools/selfplay/loop.py tools/selfplay/loop.yaml
#
# Every generation: play games with the reigning network, train both heads on a window of recent
# generations, make the candidate play the incumbent, promote it only if it wins by the threshold,
# then play a fixed opponent so absolute progress is visible and not just relative.
#
# Numbers below are for a 12-core box with one GPU. The measurements they come from are in the
# doc comments of the tools they configure.

# Where the steps actually run. `local` is subprocesses on this machine, which is what the loop has
# always done. `slurm` submits each step and waits, which changes nothing about the loop's decisions
# -- the same commands, the same artefacts, the same gate -- only which machine executes them.
#
# Check a cluster setup without spending an allocation:
#
#     python3 tools/selfplay/loop.py tools/selfplay/loop.yaml --dry-run
#
# See docs/selfplay-on-slurm.md.
runner:
  kind: slurm              # local | slurm

  slurm:
    account: null          # --account, when the cluster wants one
    # Exported at the top of every job script. The batch environment inherits the submitting one by
    # default, but a version manager's shims are the usual thing to be missing on a compute node.
    env: {}

    # One `generate.mjs` per node, each playing its own slice of the generation into
    # gen{N}/shard{i}/. The trainer reads them all without a merge, so these two numbers are the
    # whole of the scaling: how many machines, and how much of each.
    selfplay:
      nodes: 10
      cpus_per_node: 96
      partition: cca
      constraint: genoa     
      time: "02:00:00"
      # A preempted node should not discard the work the others did. Any exit code is accepted and
      # the generation is judged by how many games reached the disk; below this fraction it stops.
      quorum: 1.0

    # One node with a GPU.
    train:
      nodes: 1
      cpus_per_node: 8
      gres: "gpu:1"
      partition: gpu
      constraint: h100     # -C, e.g. "a100" or "h100". Which card decides whether a
                           # window's features fit in memory before resident() falls back
      time: "01:00:00"

    # One node. Not sharded: at 300 games against 25,000 the arena is not where the time goes, and
    # splitting it would need a report-merge step for no measured gain.
    arena:
      nodes: 1
      cpus_per_node: 96
      partition: cca
      constraint: genoa
                           # means less if the hardware under it keeps changing
      time: "01:00:00"

run:
  # Datasets, models, logs, reports and state all live here. An absolute path is used as given; a
  # relative one is taken from the repo root rather than from the shell's working directory, so the
  # loop behaves the same whichever directory it is started from.
  #
  # `/dev/shm` is tmpfs, which is the fastest option and the only volatile one. Two things follow.
  # It is RAM: a generation is ~8GB of blobs and the training window holds the previous ones, so
  # five generations is ~40GB resident, and the trainer then loads a split on top of that. And it
  # does not survive a reboot -- state.json, the promoted checkpoints and every dataset go with it,
  # which is the one thing the resumability here cannot protect against. Somewhere durable for a
  # run worth keeping:
  #
  dir: /mnt/ceph/users/jshen/games/loop
  # dir: /dev/shm/loop
  generations: 5
  # Where to start. Omitted, so this is a cold start: generation 0 is played with the hand-written
  # evaluation, which is exactly how the first dataset was ever made.
  #
  # Uncomment to carry on from an existing pair of checkpoints instead. Note that `.data/` is
  # ignored by git, so these paths only ever exist on a machine that has already trained a
  # generation -- pointing at them from a fresh checkout gets you an ENOENT four hours in.
  # seed_model:
  #   value: .data/models/value-gen0
  #   policy: .data/models/policy-gen0

selfplay:
  games: 50000
  # The main cost dial, and the one real decision here. On 12 cores, 25,000 games is ~6h at 300 and
  # ~24h at 1232 -- the network leaf buys 4.1x the iterations for the same wall clock, so 1232 costs
  # what 300 used to. Deeper search makes sharper policy targets; more games is the lever the value
  # head has actually been measured to want. There is no free answer.
  iterations: 1000
  workers: null            # null = one per core
  # Sampling the opening in proportion to visit counts. Off, because at 300 iterations over ~76 legal
  # moves the visit distribution is uniform to within a rounding error and sampling from it is not
  # exploration, it is random opening play. Worth switching on at higher iteration counts.
  temperature: 0
  temperature_moves: 15
  # Consult the policy head. Measured at 1000 iterations with gen-1's heads over 1000 games:
  # +27 elo [+6, +49] for priors at the root. Modest, and it clears zero -- where the earlier
  # 200-game attempt returned [-27, 69] and could not say either way. The gain is capped by how
  # much the priors beat uniform, so it should grow as the policy head does.
  #
  # Safe from generation zero: with no policy net to consult, PUCT falls back to UCB1's expansion
  # phase on its own, so this needs no conditional and no second setting.
  use_policy: true
  search:
    selection: puct
    puctExploration: 4     # 4, not AlphaGo Zero's 1.5 -- measured on move agreement, see config.ts
    # 99, meaning every node. Measured head to head against the same ucb1 opponent over the same
    # 1000 deals with gen-1's heads: priors at the root alone score 53.9%, +27 elo [+6, +49];
    # priors everywhere score 74.0%, +182 elo [+157, +206]. Seven times the gain for 1.76x the
    # time -- less than the 3.1x config.ts measured, because the network leaf already pays a
    # forward pass per iteration, so a second one roughly doubles rather than triples the work.
    #
    # config.ts settles this at 0 on the opposite result. That measurement was made against
    # generation zero's near-uniform priors at 300 iterations, and its own note says so: "not an
    # argument that deeper priors cannot help ... an argument that *these* priors do not". These
    # priors do.
    puctDepth: 99
    normaliseValues: true

training:
  # How many recent generations to train on. The value head's effective sample size is the number of
  # games, so a window is genuinely more labels rather than more rows. Older generations come from
  # weaker play; 1 turns it off.
  # 4, not 2. The value head's binding constraint is the number of *games* -- the trainer says so
  # each run, "effective sample size sits far nearer 40,000 than the row count" -- and a wider
  # window is the only lever that adds labels without generating anything. It was 2 when a fit cost
  # 50 minutes on CPU; on the GPU it is under 30 seconds, so the reason to keep it narrow is gone.
  window: 4
  device: null             # null = cuda if present
  # Start each generation from the reigning checkpoint instead of random weights.
  #
  # Every generation used to refit from scratch, which is the largest source of variance between
  # them and the reason the gate is load-bearing: an independent fit on a shifted window can land
  # anywhere, where AlphaZero's continuous SGD cannot. It also threw away everything the previous
  # generation had learned, every time.
  #
  # From the *incumbent*, not the previous generation -- after a rejection those differ, and the
  # rejected candidate is the one already judged worse. Declines with a note if the architecture
  # changed, so `arch` stays safe to edit mid-run.
  warm_start: true

  value:
    # 150. "40 is enough" was measured at 25,000 games, where 200 epochs moved held-out MSE by
    # ~0.001. It is not enough any more: the best epoch has climbed 5 -> 19 -> 38 of 40 as the
    # window grew, so gen-2 was still improving when the budget ran out and its score is a floor
    # rather than a result. A fit costs 24s on the GPU, so this is minutes, and early stopping
    # keeps the best epoch regardless -- an over-generous budget costs time, never quality.
    epochs: 150
    batch: 8192            # measured across 256..16384; the spread is inside holdout noise
    lr: 0.001              # scaling with batch was tried and helped nowhere -- Adam already does it
    arch: [tiny]           # the ladder [linear, tiny, mlp] diagnoses data-bound vs capacity-bound
    lambda: [0.0]          # target = (1-l)*outcome + l*search value; 0.6 won at 25k games

  policy:
    # 200, for the same reason: best epoch 78, 74, 72 of 80 across three generations, so this
    # budget has been the binding constraint the whole time. ~111s at 80 epochs.
    epochs: 200
    batch: 8192
    lr: 0.001
    arch: [wide]           # only `wide` beat a uniform prior; capacity had not saturated

# The gate. Candidate against incumbent, promote only on a win.
arena:
  games: 300               # 120 games resolves about +-62 elo; 300 gets you to roughly +-40
  iterations: 1000
  # 0.50: promote anything that is not measurably worse, rather than only what is measurably better.
  #
  # 0.55 was AlphaGo Zero's number and it was the right one while every generation was an
  # independent refit from random weights -- such a fit can land anywhere, so a candidate had to
  # prove itself before being allowed to generate the next round of data. Warm starting removes that
  # premise: a candidate now begins from the incumbent's weights, so the outcome it is most likely
  # to have is "much the same", and much the same is exactly what 0.55 throws away.
  #
  # Generation 2 scored 0.49 and was rejected. It would fail this threshold too -- 147-153 is under
  # either -- so the point is not that number but the regime it reveals: candidates land near 50%,
  # and at 300 games the interval is about +-40 elo, so clearing 0.55 reliably means being genuinely
  # 35+ elo better. Demanding that every round is how a loop stalls rather than how it stays honest,
  # and it means a generation that improved slightly is indistinguishable from one that did nothing.
  #
  # The gate stays because the direction still matters: a candidate that is genuinely worse scores
  # below 0.50 and is still refused, which is the regression this exists to stop. What changes is
  # that ties now go to the newer model, which has seen more data.
  #
  # One consequence worth knowing: against an identical model the score is a coin flip, so roughly
  # half of no-change generations will promote. That is harmless -- promoting a model of the same
  # strength costs nothing -- but "accepted" in the history stops meaning "improved".
  threshold: 0.50
  workers: null
  use_policy: true         # priors are only read under `selection: puct`
  search:
    selection: puct        # +182 elo [+157, +206] at 1000 iterations over 1000 games, gen-1 heads
    puctExploration: 4
    puctDepth: 99          # every node, not just the root -- see the note under selfplay
    normaliseValues: true  # turning this off cost 441 elo; see the note in config.ts

# Absolute progress. The gate only compares neighbours, so a loop can pass every one of them and
# still be circling. This opponent never changes, so the series of scores means something.
baseline:
  enabled: true
  games: 60
  iterations: 1000         # applies to *our* side; each anchor pins its own below
  workers: null
  # Our side searches as the loop searches. Turning this on mid-run steps the series once -- the
  # anchors do not move, so it stays readable, but the step is the priors, not progress.
  use_policy: true
  search:
    selection: puct
    puctExploration: 4
    puctDepth: 99
  # Several opponents, because one is not enough in two different ways. They saturate at different
  # times -- `random` is already pinned at 100% against an untrained generation 0 and measures
  # nothing after that, while the heuristic search keeps resolving for a long while -- so a set
  # spans a range and something is always still moving. And playing strength is not a total order:
  # a loop can drift into beating one opponent's particular weaknesses while going nowhere in
  # general, which is the failure a baseline exists to catch and the one a single opponent cannot.
  #
  # An anchor is only an anchor while it holds still, so pin its iterations inside its own spec.
  # The spec beats the --iterations flag in arena.mjs, so an anchor written this way survives a
  # later change to the loop's operating point. Do not edit these numbers once a run has started;
  # the series stops meaning anything if the opponent moves.
  opponents:
    - name: random
      spec: random
    - name: heuristic
      spec: '{"leaf":"mixed","iterations":1000}'
